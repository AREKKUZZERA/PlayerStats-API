# ============================================================
#  PlayerStatsAPI  |  config.yml
# ============================================================

# Имя мира, из которого берётся папка stats/
# Оставьте пустым для автоопределения первого мира с папкой stats/
stats-world: "world"

# Явный путь к папке stats/ (абсолютный или относительный от корня сервера)
# Если задан и существует — имеет приоритет над stats-world
stats-folder: ""

# Интервал авто-обновления статистики онлайн-игроков (в секундах)
# Поставьте 0, чтобы отключить периодическое обновление
update-interval-seconds: 60

web:
  enabled: true

  # Порт HTTP-сервера
  port: 8080

  # Адрес привязки (0.0.0.0 — все интерфейсы, 127.0.0.1 — только локально)
  bind-address: "0.0.0.0"

  # Максимум игроков в ответе /moss/players (0 = без ограничений)
  max-response-players: 0

  # Максимум строк в ответе /moss/top/<stat>
  max-top-results: 20

  cors:
    enabled: false
    allow-origin: "*"

  # Rate limiting — ограничение запросов по IP
  rate-limit:
    # Включить ограничение запросов (рекомендуется при публичном доступе)
    enabled: false

    # Максимальное количество запросов с одного IP за одно окно
    requests-per-window: 60

    # Длина окна в секундах
    window-seconds: 60
