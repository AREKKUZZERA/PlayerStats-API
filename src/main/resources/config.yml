# ============================================================
#  PlayerStatsAPI  |  config.yml
# ============================================================

stats:
  # Имя мира, из которого берётся папка stats/
  # Оставьте пустым для автоопределения первого мира с папкой stats/
  world: "world"

  # Явный путь к папке stats/ (абсолютный или относительный от корня сервера)
  # Если задан и существует — имеет приоритет над stats.world
  folder: ""

  # Интервал авто-обновления статистики онлайн-игроков (в секундах)
  # Поставьте 0, чтобы отключить периодическое обновление
  update-interval-seconds: 60

  # Логировать каждое фоновое обновление статистики в консоль
  # false = не спамить сообщениями [Sync] раз в update-interval-seconds
  log-sync-updates: false

history:
  # Максимум точек роста play_time на игрока в plugins/PlayerStatsAPI/history.json
  # 2880 ~= 2 дня при update-interval-seconds: 60
  max-points-per-player: 2880

commands:
  # Основная админ-команда:
  # /playerstatsapi, /psa, /psapi
  #
  # Подкоманды:
  # /psa help
  # /psa status
  # /psa reload
  # /psa synclog <on|off>
  #
  # Игровые команды:
  # /stat <игрок> <minecraft:ключ>
  # /stats <игрок>
  # /statstop <minecraft:ключ> [лимит]
  # /statsonline
  # /statsreload

  # Лимит по умолчанию для /statstop, если игрок не указал [лимит]
  default-top-limit: 10

  # Максимальный лимит для /statstop
  max-top-limit: 50

web:
  enabled: true

  # Порт HTTP-сервера
  port: 8080

  # Адрес привязки (0.0.0.0 — все интерфейсы, 127.0.0.1 — только локально)
  bind-address: "0.0.0.0"

  # Максимум игроков в ответе /moss/players (0 = без ограничений)
  max-response-players: 0

  # Максимум строк в ответе /moss/top/<stat>
  max-top-results: 20

  cors:
    enabled: false
    allow-origin: "*"

  # Rate limiting — ограничение запросов по IP
  rate-limit:
    # Включить ограничение запросов (рекомендуется при публичном доступе)
    enabled: false

    # Максимальное количество запросов с одного IP за одно окно
    requests-per-window: 60

    # Длина окна в секундах
    window-seconds: 60
