name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build with Maven
        run: mvn -B clean package -DskipTests

      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: PlayerStatsAPI
          path: |
            target/*.jar
            !target/original-*.jar

  publish-modrinth:
    runs-on: ubuntu-latest
    needs: build
    # Публикация только при push тега (v1.0, v2.1 и т.д.)
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build with Maven
        run: mvn -B clean package -DskipTests

      - name: Publish to Modrinth
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ secrets.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

          name: PlayerStatsAPI ${{ github.ref_name }}
          version: ${{ github.ref_name }}
          version-type: release

          files: target/PlayerStats-API-*.jar

          # Автодетект поддерживаемых версий из plugin.yml api-version
          game-versions: |
            1.21
            1.21.1
            1.21.2
            1.21.3
            1.21.4
          loaders: |
            paper
            purpur

          changelog-file: CHANGELOG.md
